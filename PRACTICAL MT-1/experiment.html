<!DOCTYPE html>
<html>
<head>
    <title>Employee Record</title>
    <link rel="stylesheet" href="experiment.css">
</head>
<body>

    <h1>EMPLOYEE RECORD SYSTEM</h1>

    <div class="form-box">
        <input type="text" id="id" placeholder="Enter ID">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="text" id="department" placeholder="Enter Department">
        <input type="number" id="salary" placeholder="Enter Salary">

        <button onclick="addEmployee()">Add Employee</button>
        <button onclick="displayEmployees()">Display All</button>
        <button onclick="filterEmployees()">Filter IT</button>
        <button onclick="calculateSalary()">Total Salary</button>
    </div>

    <h2>Employee List</h2>
    <div id="output"></div>

    <script src="experiment.js"></script>
</body>
</html>
